<section>
  <h2>Webbutveckling - Ramschema</h2>
  <div id="tableholder">
    <div id="searchcontainer">
      <label for="search">Sök:</label>
      <input type="text" id="search" name="search" placeholder="Sök efter kurskod eller kursnamn" />
    </div>
    <table>
      <thead>
        <tr>
          <th>Kurskod</th>
          <th>Namn</th>
          <th>Progression</th>
        </tr>
      </thead>
      <tbody>
        @for (course of courses(); track course.code) {
          <tr>
            <td>{{ course.code }}</td>
            <td>{{ course.coursename }}</td>
            <td>{{ course.progression }}</td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</section>
